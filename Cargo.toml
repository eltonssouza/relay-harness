[workspace]
resolver = "2"
members = ["crates/harness-core", "crates/harness-wasm", "crates/relay-ai", "crates/relay-agent", "packages/desktop/src-tauri"]
# The desktop shell builds only when asked (`-p relay-desktop`): it needs the built screen and,
# on Linux, the WebKitGTK development packages.
default-members = ["crates/harness-core", "crates/harness-wasm", "crates/relay-ai", "crates/relay-agent"]

[workspace.package]
edition = "2021"
license = "MIT"
publish = false

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
