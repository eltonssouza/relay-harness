[package]
name = "relay-harness-core"
version = "0.0.0"
description = "The model-independent harness core of Relay: classification, alignment and evidence."
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
serde_json = { version = "=1.0.154", default-features = false, features = ["std"] }
fancy-regex = { version = "=0.20.2", default-features = false, features = ["std"] }
regex = { version = "=1.13.2", default-features = false, features = ["std", "unicode-perl", "unicode-case", "unicode-gencat"] }
unicode-normalization = { version = "=0.1.24", default-features = false, features = ["std"] }

