[package]
name = "relay-harness-wasm"
version = "0.0.0"
description = "The Relay harness core as a WebAssembly module with a JSON ABI."
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
relay-harness-core = { path = "../harness-core" }
serde_json = { version = "=1.0.154", default-features = false, features = ["std"] }
