[package]
name = "relay-ai"
version = "0.0.0"
description = "Relay's model layer, ported from packages/ai: the transcript types, and later the provider adapters."
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "=1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["std"] }
