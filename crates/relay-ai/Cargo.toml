[package]
name = "relay-ai"
version = "0.0.0"
description = "Relay's model layer, ported from packages/ai: the transcript types, the provider adapters and sending their requests."
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "=1.0.229", default-features = false, features = ["std", "derive"] }
# Insertion order, as JavaScript objects keep it (request bodies must match the TypeScript ones),
# and exact float parsing, so recorded numbers read back as the values JavaScript computed.
serde_json = { version = "=1.0.154", default-features = false, features = ["std", "preserve_order", "float_roundtrip"] }
# HTTP for provider requests. TLS is rustls with the ring backend, which builds on Windows and
# Linux without CMake or NASM; certificates are checked against the operating system's store
# (rustls-platform-verifier), so corporate CAs work as they do for the TypeScript agent.
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "system-proxy"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "time", "sync", "macros"] }

[dev-dependencies]
# A local server for the HTTP tests; no test reaches a real provider.
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "rt-multi-thread", "time", "sync", "macros", "net", "io-util"] }
