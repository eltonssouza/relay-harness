[package]
name = "relay-resources"
version = "0.0.0"
description = "Relay's resources, ported from packages/coding-agent/src/core: the system prompt, the skills it lists and the context and prompt files it is built from."
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
relay-ai = { path = "../relay-ai" }
relay-settings = { path = "../relay-settings" }
relay-tools = { path = "../relay-tools" }
serde = { version = "=1.0.229", default-features = false, features = ["std", "derive"] }

[dev-dependencies]
serde_json = { version = "=1.0.154", default-features = false, features = ["std", "preserve_order", "float_roundtrip"] }
