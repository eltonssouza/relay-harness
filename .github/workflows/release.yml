name: Release

# Publishes every public workspace package to npm when a version tag is pushed, and builds the
# desktop installers (`desktop-installers`).
# Authentication is the NPM_TOKEN secret of the npm-publish environment: a granular access token
# with read and write (publish and stage) on the @relay-harness scope, with 2FA bypass. It expires;
# when publishing starts failing with 401 or 403, create a new token and replace the secret.
# Provenance is off: npm only issues it for public repositories. To switch to trusted publishing
# once the repository is public, drop NODE_AUTH_TOKEN, add `id-token: write`, set
# NPM_PROVENANCE=true and register the workflow as a trusted publisher on each package.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g., v1.0.3). Publishing is idempotent: versions already on npm are skipped.'
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev ripgrep

      - name: Install fd
        # The find tool tests need fd 10.2 or newer (--no-require-git); Ubuntu's fd-find is 9.x.
        run: cargo install fd-find --version 10.3.0 --locked

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check the tag matches the package version
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./packages/coding-agent/package.json').version")"
          if [ "${RELEASE_TAG#v}" != "${VERSION}" ]; then
            echo "Tag ${RELEASE_TAG} does not match packages/coding-agent version ${VERSION}" >&2
            exit 1
          fi

      - name: Build
        run: npm run build:offline

      - name: Check
        run: npm run check

      - name: Test
        run: ./test.sh

      - name: Smoke-test packed npm consumer
        run: npm run check:package-install

      - name: Check the npm token
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish npm packages
        run: node scripts/publish.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # The desktop installers, one per platform, kept as artifacts of this run (no GitHub release is
  # made). They are not code-signed yet: Windows SmartScreen and macOS Gatekeeper warn on first
  # launch. The app runs `relay` from PATH, so it still needs the npm package installed.
  desktop-installers:
    name: Desktop installer (${{ matrix.bundle }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle: msi
          - os: macos-latest
            bundle: dmg
          - os: ubuntu-22.04
            bundle: appimage
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install the WebKitGTK packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Check the tag matches the desktop version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./packages/desktop/package.json').version")"
          if [ "${RELEASE_TAG#v}" != "${VERSION}" ]; then
            echo "Tag ${RELEASE_TAG} does not match packages/desktop version ${VERSION}" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build the screen
        run: npm run build --workspace @relay-harness/desktop

      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version 2.12.6 --locked

      - name: Build the installer
        working-directory: packages/desktop/src-tauri
        run: cargo tauri build --bundles ${{ matrix.bundle }}

      - name: Keep the installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relay-desktop-${{ env.RELEASE_TAG }}-${{ matrix.bundle }}
          path: target/release/bundle/${{ matrix.bundle }}/
          if-no-files-found: error
