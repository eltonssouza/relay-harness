name: Release

# Builds Relay's standalone binaries and the desktop installers when a version tag is pushed. Relay
# is not published to npm. Both are kept as artifacts of the run (no GitHub release is made): the
# `relay-binaries-<tag>` archives for six platforms, and one installer per desktop platform, which
# carries that platform's binary. Neither is code-signed yet.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g., v0.6.0).'
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  binaries:
    name: Standalone binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'

      - name: Check the tag matches the package version
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./packages/coding-agent/package.json').version")"
          if [ "${RELEASE_TAG#v}" != "${VERSION}" ]; then
            echo "Tag ${RELEASE_TAG} does not match packages/coding-agent version ${VERSION}" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Bun cross-compiles every platform from here; the release commit already carries the
      # refreshed model catalog, so the build uses it instead of fetching a newer one.
      - name: Build the binaries
        run: bash ./scripts/build-binaries.sh --skip-install --offline-model-data --out dist-binaries

      - name: Keep the binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relay-binaries-${{ env.RELEASE_TAG }}
          path: |
            dist-binaries/*.zip
            dist-binaries/*.tar.gz
          if-no-files-found: error

  # One installer per platform. The app runs the relay binary it carries, so no separate install is
  # needed. Windows SmartScreen and macOS Gatekeeper warn on first launch until the installers are
  # signed.
  desktop-installers:
    name: Desktop installer (${{ matrix.bundle }})
    needs: binaries
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle: msi
            binary: windows-x64
          - os: macos-latest
            bundle: dmg
            binary: darwin-arm64
          - os: ubuntu-22.04
            bundle: appimage
            binary: linux-x64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install the WebKitGTK packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Check the tag matches the desktop version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./packages/desktop/package.json').version")"
          if [ "${RELEASE_TAG#v}" != "${VERSION}" ]; then
            echo "Tag ${RELEASE_TAG} does not match packages/desktop version ${VERSION}" >&2
            exit 1
          fi

      - name: Get the binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: relay-binaries-${{ env.RELEASE_TAG }}
          path: dist-binaries

      # The installer carries the binary as a resource (tauri.conf.json bundles `resources/relay/`).
      - name: Put the binary in the installer's resources (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Expand-Archive -Path "dist-binaries/relay-${{ matrix.binary }}.zip" -DestinationPath packages/desktop/src-tauri/resources/relay -Force

      - name: Put the binary in the installer's resources
        if: runner.os != 'Windows'
        run: tar -xzf "dist-binaries/relay-${{ matrix.binary }}.tar.gz" --strip-components=1 -C packages/desktop/src-tauri/resources/relay

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build the screen
        run: npm run build --workspace @relay-harness/desktop

      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version 2.12.6 --locked

      - name: Build the installer
        working-directory: packages/desktop/src-tauri
        run: cargo tauri build --bundles ${{ matrix.bundle }}

      - name: Keep the installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relay-desktop-${{ env.RELEASE_TAG }}-${{ matrix.bundle }}
          path: target/release/bundle/${{ matrix.bundle }}/
          if-no-files-found: error
