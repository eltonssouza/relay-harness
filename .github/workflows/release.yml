name: Release

# Publishes every public workspace package to npm when a version tag is pushed.
# Authentication is the NPM_TOKEN secret of the npm-publish environment: a granular access token
# with read and write (publish and stage) on the @relay-harness scope, with 2FA bypass. It expires;
# when publishing starts failing with 401 or 403, create a new token and replace the secret.
# Provenance is off: npm only issues it for public repositories. To switch to trusted publishing
# once the repository is public, drop NODE_AUTH_TOKEN, add `id-token: write`, set
# NPM_PROVENANCE=true and register the workflow as a trusted publisher on each package.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g., v1.0.3). Publishing is idempotent: versions already on npm are skipped.'
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s $(which fdfind) /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check the tag matches the package version
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./packages/coding-agent/package.json').version")"
          if [ "${RELEASE_TAG#v}" != "${VERSION}" ]; then
            echo "Tag ${RELEASE_TAG} does not match packages/coding-agent version ${VERSION}" >&2
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Check
        run: npm run check

      - name: Test
        run: ./test.sh

      - name: Smoke-test packed npm consumer
        run: npm run check:package-install

      - name: Check the npm token
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish npm packages
        run: node scripts/publish.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
