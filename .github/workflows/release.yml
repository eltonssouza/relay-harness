name: Release

# Publishes every public workspace package to npm when a version tag is pushed.
# Authentication is npm trusted publishing (GitHub Actions OIDC): no npm token is stored.
# One-time setup on npmjs.com: for each @relay-harness/* package, add a trusted publisher for
# repository eltonssouza/relay-harness, workflow release.yml, environment npm-publish.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g., v1.0.3). Publishing is idempotent: versions already on npm are skipped.'
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s $(which fdfind) /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check the tag matches the package version
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./packages/coding-agent/package.json').version")"
          if [ "${RELEASE_TAG#v}" != "${VERSION}" ]; then
            echo "Tag ${RELEASE_TAG} does not match packages/coding-agent version ${VERSION}" >&2
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Check
        run: npm run check

      - name: Test
        run: ./test.sh

      - name: Smoke-test packed npm consumer
        run: npm run check:package-install

      # Trusted publishing needs npm 11.5.1 or newer; Node 22 ships an older npm.
      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@11.16.0 --ignore-scripts
          npm --version

      - name: Publish npm packages
        run: node scripts/publish.mjs
