name: PR CI

# Runs the repository's own gate (ci.sh) on Linux for pull requests to develop. It does not replace
# the local run that AGENTS.md requires before a commit: Windows and macOS stay local-only gates,
# and the required local/verify status is still published from a complete local run.
# pull_request, not pull_request_target: the workflow runs the pull request's code with a read-only token.

on:
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - name: Install native build prerequisites
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev
      - name: Run the local gate
        run: bash ./ci.sh
      - name: Check that the gate left the tree clean
        # npm run check formats files in place; a pull request that needed formatting fails here.
        run: git diff --exit-code
